[package]
name = "qk-wallet-v2"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "HOST-only fixed-memory QuietKey v2 derivation and purpose-bound Kit-sweep or feature-gated normal role-A signing."

[features]
default = []
normal-v3 = ["qk-psbt/normal-v3"]

[dependencies]
qk-descriptor = { path = "../qk-descriptor" }
qk-psbt = { path = "../qk-psbt" }
qk-secp = { path = "../qk-secp" }

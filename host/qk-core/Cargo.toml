[package]
name = "qk-core"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "HOST-only QuietKey trusted-process provisioning and purpose-bound normal shell. Not target or production evidence."

[features]
fuzzing = ["qk-ipc/fuzzing"]

[dependencies]
qk-a1 = { path = "../qk-a1" }
qk-bbqr = { path = "../qk-bbqr" }
qk-descriptor = { path = "../qk-descriptor" }
qk-ipc = { path = "../qk-ipc" }
qk-psbt = { path = "../qk-psbt", features = ["normal-v3"] }
qk-provisioning = { path = "../qk-provisioning" }
qk-wallet-v2 = { path = "../qk-wallet-v2", features = ["normal-v3"] }

[dev-dependencies]
qk-host-sim = { path = "../qk-host-sim" }
qk-io = { path = "../qk-io" }
qk-secp = { path = "../qk-secp" }

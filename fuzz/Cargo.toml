[package]
name = "quietkey-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[features]
default = ["qk-provisioning/fuzzing", "qk-host-sim/fuzzing", "qk-update/fuzzing"]

[dependencies]
libfuzzer-sys = { version = "=0.4.13" }
qk-a1 = { path = "../host/qk-a1", version = "=0.0.1" }
qk-a1-codec = { path = "../host/qk-a1-codec", version = "=0.0.1" }
qk-bbqr = { path = "../host/qk-bbqr", version = "=0.0.1" }
qk-card-trace = { path = "../host/qk-card-trace", version = "=0.0.1" }
qk-descriptor = { path = "../host/qk-descriptor", version = "=0.0.1" }
qk-host-sim = { path = "../host/qk-host-sim", version = "=0.0.1" }
qk-kit = { path = "../host/qk-kit", version = "=0.0.1" }
qk-provisioning = { path = "../host/qk-provisioning", version = "=0.0.1" }
qk-psbt = { path = "../host/qk-psbt", version = "=0.0.1" }
qk-secp = { path = "../host/qk-secp", version = "=0.0.1" }
qk-update = { path = "../host/qk-update", version = "=0.0.1" }

[[bin]]
name = "qk_psbt"
path = "fuzz_targets/qk_psbt.rs"
